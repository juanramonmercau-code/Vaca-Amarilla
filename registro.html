  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Inter', sans-serif; background: #fff; }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 12px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .header-logo img {
      height: 32px;
      width: 32px;
      object-fit: contain;
      border-radius: 5px;
    }
    .header-logo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      color: #0A0A0A;
    }

    .btn-back {
      font-size: 13px;
      color: #666;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .btn-back:hover { color: #0A0A0A; }

    .tally-wrap {
      padding-top: 57px;
      min-height: 100vh;
    }

    iframe {
      width: 100%;
      min-height: calc(100vh - 57px);
      border: none;
      display: block;
    }
  </style>
